name: Keep-alive

on:
  schedule:
    # Wekelijks, dinsdag 04:03 UTC: houdt het schema wakker (GitHub pauzeert
    # schedules na 60 dagen zonder commits; deze commit reset de timer).
    - cron: "3 4 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reset de 60-dagen-timer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "Keep-alive: reset 60-dagen-timer" || exit 0
          git push
